# Hand-checked facts for the Interfaces appendix (interfaces.html), merged by build.py with the Nereus capture
# (public/data/rosgraph) and the firmware sources. Every entry here was read from the code at the branch in use;
# paths are relative to the repo root and are turned into GitHub links (line numbers looked up at build time).

repos:
  riptide_core:       {local: ~/osu-uwrt/release/src/riptide_core,        ref: origin/followpath-speed,      gh: osu-uwrt/riptide_core,        branch: followpath-speed}
  riptide_control:    {local: ~/osu-uwrt/release/src/riptide_control,     ref: origin/mpc,                   gh: osu-uwrt/riptide_control,     branch: mpc}
  riptide_perception: {local: ~/osu-uwrt/release/src/riptide_perception,  ref: origin/mapping-estimator,     gh: osu-uwrt/riptide_perception,  branch: mapping-estimator}
  riptide_autonomy:   {local: ~/osu-uwrt/release/src/riptide_autonomy,    ref: origin/autonomy-mapping,      gh: osu-uwrt/riptide_autonomy,    branch: autonomy-mapping}
  riptide_launch:     {local: ~/osu-uwrt/release/src/riptide_launch,      ref: origin/newsim,                gh: osu-uwrt/riptide_launch,      branch: newsim}
  nereus:             {local: ~/osu-uwrt/release/nereus,                  ref: origin/main,                  gh: osu-uwrt/nereus,              branch: main}
  titan_firmware:     {local: ~/osu-uwrt/development/titan_firmware,      ref: origin/master,                gh: osu-uwrt/titan_firmware,      branch: master}
  nortek_dvl:         {local: ~/osu-uwrt/release/src/nortek_dvl,          ref: origin/DvlWaterTrackFallback, gh: osu-uwrt/nortek_dvl,          branch: DvlWaterTrackFallback}
  apriltag_ros:       {local: ~/osu-uwrt/release/src/apriltag_ros,        ref: origin/CompressedImages,      gh: osu-uwrt/apriltag_ros,        branch: CompressedImages}
  zed_wrapper:        {local: ~/osu-uwrt/release/src/zed-ros2-wrapper,    ref: HEAD,                         gh: stereolabs/zed-ros2-wrapper,  branch: f6978f5}
  chameleon_tf:       {local: ~/osu-uwrt/release/src/chameleon_tf,        ref: HEAD,                         gh: coalman321/chameleon_tf,      branch: f1d3e19}

subsystems:
  - {id: sensors,    label: Sensors,              chapter: sensors.html}
  - {id: cameras,    label: Cameras,              chapter: cameras.html#topics}
  - {id: estimation, label: State estimation,     chapter: localization.html}
  - {id: control,    label: Control,              chapter: control/index.html}
  - {id: thrusters,  label: Thrusters,            chapter: thrusters-hw.html#path}
  - {id: perception, label: Perception,           chapter: perception/detector.html}
  - {id: mapping,    label: Mapping,              chapter: perception/map.html}
  - {id: autonomy,   label: Autonomy,             chapter: bt-nodes.html#ros}
  - {id: actuators,  label: Actuators,            chapter: actuators.html#ros}
